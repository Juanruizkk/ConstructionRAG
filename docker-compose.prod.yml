# Production stack for Dokploy (db + api + web on one network).
# Dokploy clones the repo and runs this compose; set the env vars in the Dokploy UI.
# The DB auto-restores data/ssi_seed.sql.gz on FIRST boot only (empty volume) via
# the postgres entrypoint's /docker-entrypoint-initdb.d hook — no ETL runs on the VPS.
services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ssi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ssi}
      POSTGRES_DB: ssi
    volumes:
      - ssi_pgdata:/var/lib/postgresql/data
      # Seeded once on first init (ignored after the data dir exists).
      - ./data/ssi_seed.sql.gz:/docker-entrypoint-initdb.d/ssi_seed.sql.gz:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ssi -d ssi"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgres://ssi:${POSTGRES_PASSWORD:-ssi}@db:5432/ssi
      GROQ_API_KEY: ${GROQ_API_KEY}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-120b}
      # DOL key so adding a sub triggers live background enrichment (rate-limited, best-effort).
      API_KEY_ODP: ${API_KEY_ODP}
      PORT: "3001"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    # Attach your domain to this service (port 80) in the Dokploy UI.
    # nginx.conf proxies /api/* -> http://api:3001 on the compose network.
    depends_on:
      - api
    restart: unless-stopped

volumes:
  ssi_pgdata:
