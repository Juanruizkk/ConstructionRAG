server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # A8: in production the browser calls /api/*; proxy to the api service (Dokploy same network).
  location /api/ {
    proxy_pass http://api:3001/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_read_timeout 120s;   # agent/chat calls can be slow
  }

  # SPA fallback.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
