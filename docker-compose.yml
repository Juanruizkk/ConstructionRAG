services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ssi
      POSTGRES_PASSWORD: ssi
      POSTGRES_DB: ssi
    ports:
      - "5433:5432"
    volumes:
      - ssi_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ssi -d ssi"]
      interval: 3s
      timeout: 3s
      retries: 10
volumes:
  ssi_pgdata:
